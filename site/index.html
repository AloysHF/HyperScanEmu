<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HyperScanEmu — Mattel HyperScan emulator. Under active development.">
  <title>HyperScanEmu</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0b0d12;
      color: #e8ecf4;
      line-height: 1.6;
    }
    main {
      text-align: center;
      padding: 2rem;
      max-width: 36rem;
    }
    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      margin: 0 0 0.75rem;
      letter-spacing: 0.02em;
    }
    p { color: #9aa3b5; margin: 0.5rem 0; }
    .status {
      display: inline-block;
      margin-top: 1.25rem;
      padding: 0.45rem 0.9rem;
      border: 1px solid #243044;
      border-radius: 999px;
      color: #6ea8ff;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>HyperScanEmu</h1>
    <p>Mattel HyperScan emulator written in Rust.</p>
    <p>项目仍在开发中，敬请期待。</p>
    <p class="status">Under active development — stay tuned</p>
  </main>
</body>
</html>
