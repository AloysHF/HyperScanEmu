[package]
name = "hyperscanemu-libretro"
version.workspace = true
edition.workspace = true
license.workspace = true
description.workspace = true

[lib]
name = "hyperscanemu"
# `staticlib` is only used by the EmulatorJS build, which links the core into
# the wasm frontend; native builds keep producing the cdylib.
crate-type = ["cdylib", "staticlib"]
path = "src/lib.rs"

[dependencies]
hyperscanemu-core = { path = "../hyperscanemu-core" }
hyperscanemu-media = { path = "../hyperscanemu-media" }
